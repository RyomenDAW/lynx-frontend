<div class="tienda-container page fade-in">

  <!-- ALERTA ÉXITO -->
  <div *ngIf="successMessage" class="notificacion-flotante exito">
    {{ successMessage }}
  </div>

  <!-- ALERTA ERROR -->
  <div *ngIf="errorMessage" class="notificacion-flotante error">
    {{ errorMessage }}
  </div>

  <!-- BUSCADOR -->
  <div class="buscador">
    <input type="text" [(ngModel)]="busqueda" placeholder="🔍 Buscar videojuego..." />
  </div>

  <h2 class="titulo-seccion">Lynx Store - Videojuegos</h2>

  <!-- BOTONES ADMIN -->
  <div *ngIf="tienePermiso()" class="acciones-superior">
    <button routerLink="/tienda/importar" class="btn">Importar desde Steam</button>
    <button routerLink="/tienda/crear" class="btn">Crear manualmente</button>
  </div>

  <!--  SKELETON DE CARGA -->
  <div *ngIf="cargando" class="lista-videojuegos">
    <div *ngFor="let i of [1,2,3]" class="fila-juego skeleton">
      <div class="juego-portada skeleton-box"></div>
      <div class="juego-info">
        <div class="skeleton-text titulo"></div>
        <div class="skeleton-text descripcion"></div>
        <div class="skeleton-text descripcion short"></div>
        <div class="juego-botones">
          <div class="skeleton-button"></div>
          <div class="skeleton-button"></div>
          <div class="skeleton-button"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ✅ LISTA REAL DE JUEGOS -->
  <div *ngIf="!cargando" class="lista-videojuegos">
    <div *ngFor="let juego of videojuegosFiltrados()" class="fila-juego">
      <img *ngIf="juego.imagen_portada_base64" [src]="juego.imagen_portada_base64" alt="Portada" class="juego-portada" />

      <div class="juego-info">
        <div class="juego-header">
          <h3 class="juego-titulo">{{ juego.titulo }}</h3>
          <span class="juego-precio">{{ juego.precio }} €</span>
        </div>

        <p class="juego-descripcion">{{ juego.descripcion }}</p>

        <div class="juego-botones">
          <button class="btn-secundario" [routerLink]="['/tienda/detalle', juego.id]">Detalles</button>
          <button class="btn-secundario">Reseña</button>
          <button class="btn-accion" [disabled]="juego.comprado" (click)="comprarVideojuego(juego)">
            {{ juego.comprado ? 'Ya lo tienes' : 'Comprar' }}
          </button>
          <button *ngIf="tienePermiso()" (click)="eliminarJuego(juego.id)" class="btn-eliminar">Eliminar</button>
        </div>
      </div>
    </div>
  </div>

</div>
