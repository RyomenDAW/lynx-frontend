server {
    listen 80;
    listen [::]:80;
    server_name localhost; # In production, this should be your domain name or EC2 IP

    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # IMPORTANT: Add this block to proxy API requests to your backend
    location /api/ {
        # 'backend' is the service name defined in your docker-compose.yml
        # '8000' is the port your Django Gunicorn server is listening on inside its container (as per your Dockerfile)
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}